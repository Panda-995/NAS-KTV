# NASKTV Release pipeline
#
# Triggered when release-please PUBLISHES the GitHub Release for a `v*` tag
# (after the "Release PR" is merged).
#
# IMPORTANT: release-please creates the tag via the GitHub Releases API, which
# does NOT fire a `push` event. So we listen to `release: published`, NOT
# `push: tags`. The tag name is passed down to the child workflows explicitly
# because `github.ref_name` is not reliable inside a `workflow_call`.
#
# This workflow only BUILDS and ATTACHES artifacts to that release:
#   1. docker    : build & push backend / separator / web to Aliyun ACR
#   2. desktop   : build Win(x86/i686) / macOS(x64/arm64)  [no signing]
#   3. android   : build arm64-v8a / armeabi-v7a APKs  [no signing]
#
# Docker images live in ACR (not release assets); desktop & android binaries
# are attached to the GitHub Release.

name: Release NASKTV

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.2.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  docker:
    uses: ./.github/workflows/docker.yml
    secrets: inherit
    with:
      tag: ${{ github.event.release.tag_name || inputs.tag }}

  desktop:
    needs: docker
    uses: ./.github/workflows/desktop.yml
    secrets: inherit
    with:
      tag: ${{ github.event.release.tag_name || inputs.tag }}

  android:
    needs: desktop
    uses: ./.github/workflows/android.yml
    secrets: inherit
    with:
      tag: ${{ github.event.release.tag_name || inputs.tag }}
