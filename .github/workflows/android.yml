# Build NASKTV TV Android APKs (arm64-v8a 64-bit / armeabi-v7a 32-bit).
#
# Reusable workflow: call from release.yml (with `tag`), or dispatch manually.
#
# Outputs are debug-signed APKs ready for sideloading on Android TV.

name: Build TV Android

on:
  workflow_call:
    inputs:
      tag:
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      tag:
        type: string
        default: ''
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rust_target: aarch64-linux-android
            tauri_target: aarch64
            arch: arm64-v8a
          - rust_target: armv7-linux-androideabi
            tauri_target: armv7
            arch: armeabi-v7a
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK + build-tools
        run: |
          sdkmanager "ndk;26.3.11579264" "platforms;android-36" "build-tools;36.0.0"
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Sync version to tag
        if: ${{ inputs.tag != '' }}
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: node scripts/set-version.mjs "${TAG#v}"

      - name: Build APK
        env:
          CI: true
        run: >-
          pnpm --filter @nasktv/tv-app exec tauri android build
          --target ${{ matrix.tauri_target }} --apk --debug --ci

      - name: Prepare and verify APK
        shell: bash
        run: |
          APK="$(find packages/tv-app/src-tauri/gen/android -name '*-debug.apk' -print -quit)"
          test -n "${APK}"
          cp "${APK}" "nasktv-tv-${{ matrix.arch }}.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify \
            --verbose \
            --print-certs \
            "nasktv-tv-${{ matrix.arch }}.apk"

      - name: Upload to Release
        if: ${{ inputs.tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: nasktv-tv-${{ matrix.arch }}.apk

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tv-android-${{ matrix.arch }}
          path: nasktv-tv-${{ matrix.arch }}.apk
          if-no-files-found: error
