# Build and publish the three Docker Compose images to GitHub Container Registry.
# Every tag is a multi-platform manifest for linux/amd64 and linux/arm64.

name: Build Docker Images

on:
  workflow_call:
    inputs:
      tag:
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional release tag (for example v0.2.0)'
        type: string
        default: ''
        required: false
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build ${{ matrix.service.name }} (${{ matrix.architecture.name }})
    runs-on: ${{ matrix.architecture.runner }}
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: backend
            context: .
            dockerfile: packages/backend/Dockerfile
            image: nas-ktv-backend
          - name: separator
            context: packages/separator
            dockerfile: packages/separator/Dockerfile
            image: nas-ktv-separator
          - name: web
            context: .
            dockerfile: packages/web/Dockerfile
            image: nas-ktv-web
        architecture:
          - name: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - name: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name
        id: image
        env:
          IMAGE_NAME: ${{ matrix.service.image }}
          ARCHITECTURE: ${{ matrix.architecture.name }}
        shell: bash
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          IMAGE="${REGISTRY}/${OWNER}/${IMAGE_NAME}"
          echo "name=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tag=${IMAGE}:build-${GITHUB_SHA::12}-${ARCHITECTURE}" >> "$GITHUB_OUTPUT"

      - name: Build and push architecture image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          platforms: ${{ matrix.architecture.platform }}
          push: true
          tags: ${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=NASKTV ${{ matrix.service.name }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=${{ matrix.service.name }}-${{ matrix.architecture.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}-${{ matrix.architecture.name }}

  publish:
    name: Publish ${{ matrix.service.name }} manifest
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: backend
            image: nas-ktv-backend
          - name: separator
            image: nas-ktv-separator
          - name: web
            image: nas-ktv-web
    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and verify multi-architecture manifest
        env:
          IMAGE_NAME: ${{ matrix.service.image }}
          REQUESTED_TAG: ${{ inputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          IMAGE="${REGISTRY}/${OWNER}/${IMAGE_NAME}"
          RELEASE_TAG="${REQUESTED_TAG}"
          if [[ -z "${RELEASE_TAG}" && "${GITHUB_REF_TYPE}" == "tag" ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
          fi

          TAGS=()
          if [[ -n "${RELEASE_TAG}" ]]; then
            VERSION="${RELEASE_TAG#v}"
            if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
              echo "Expected a semantic version tag such as v0.2.0, got: ${RELEASE_TAG}" >&2
              exit 1
            fi
            TAGS+=("${IMAGE}:${VERSION}")
            TAGS+=("${IMAGE}:$(cut -d. -f1,2 <<< "${VERSION}")")
            TAGS+=("${IMAGE}:latest")
          elif [[ "${GITHUB_REF_NAME}" == "${DEFAULT_BRANCH}" ]]; then
            TAGS+=("${IMAGE}:latest")
            TAGS+=("${IMAGE}:sha-${GITHUB_SHA::12}")
          else
            TAGS+=("${IMAGE}:sha-${GITHUB_SHA::12}")
          fi

          CREATE_ARGS=()
          for TAG in "${TAGS[@]}"; do
            CREATE_ARGS+=(--tag "${TAG}")
          done

          docker buildx imagetools create \
            "${CREATE_ARGS[@]}" \
            "${IMAGE}:build-${GITHUB_SHA::12}-amd64" \
            "${IMAGE}:build-${GITHUB_SHA::12}-arm64"

          MANIFEST="$(docker buildx imagetools inspect --raw "${TAGS[0]}")"
          jq -e '
            any(.manifests[]; .platform.os == "linux" and .platform.architecture == "amd64") and
            any(.manifests[]; .platform.os == "linux" and .platform.architecture == "arm64")
          ' <<< "${MANIFEST}"
