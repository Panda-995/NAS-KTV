# Build and publish the three Docker Compose images to GitHub Container Registry.
# Every tag is a multi-platform manifest for linux/amd64 and linux/arm64.

name: Build Docker Images

on:
  workflow_call:
    inputs:
      tag:
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional release tag (for example v0.2.0)'
        type: string
        default: ''
        required: false
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: .
            dockerfile: packages/backend/Dockerfile
            image: nas-ktv-backend
          - name: separator
            context: packages/separator
            dockerfile: packages/separator/Dockerfile
            image: nas-ktv-separator
          - name: web
            context: .
            dockerfile: packages/web/Dockerfile
            image: nas-ktv-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        env:
          IMAGE_NAME: ${{ matrix.image }}
          REQUESTED_TAG: ${{ inputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          IMAGE="${REGISTRY}/${OWNER}/${IMAGE_NAME}"
          RELEASE_TAG="${REQUESTED_TAG}"
          if [[ -z "${RELEASE_TAG}" && "${GITHUB_REF_TYPE}" == "tag" ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
          fi

          TAGS=()
          if [[ -n "${RELEASE_TAG}" ]]; then
            VERSION="${RELEASE_TAG#v}"
            if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
              echo "Expected a semantic version tag such as v0.2.0, got: ${RELEASE_TAG}" >&2
              exit 1
            fi
            TAGS+=("${IMAGE}:${VERSION}")
            TAGS+=("${IMAGE}:$(cut -d. -f1,2 <<< "${VERSION}")")
            TAGS+=("${IMAGE}:latest")
          elif [[ "${GITHUB_REF_NAME}" == "${DEFAULT_BRANCH}" ]]; then
            TAGS+=("${IMAGE}:latest")
            TAGS+=("${IMAGE}:sha-${GITHUB_SHA::12}")
          else
            TAGS+=("${IMAGE}:sha-${GITHUB_SHA::12}")
          fi

          {
            echo "image=${IMAGE}"
            echo "tags<<EOF"
            printf '%s\n' "${TAGS[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=NASKTV ${{ matrix.name }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
