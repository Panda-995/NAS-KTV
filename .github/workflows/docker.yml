# Build & push NASKTV Docker images (backend / separator / web)
#
# Reusable workflow: call from release.yml, or dispatch manually.
#
# Required repo/environment secrets:
#   ALIYUN_ACR_REGISTRY   e.g. registry.cn-hangzhou.aliyuncs.com
#   ALIYUN_ACR_USERNAME   ACR login username (usually RAM AccessKeyId)
#   ALIYUN_ACR_PASSWORD   ACR login password (usually RAM AccessKeySecret)
#   ALIYUN_ACR_NAMESPACE  image namespace, e.g. nasktv
#
# Images are pushed to:
#   <REGISTRY>/<NAMESPACE>/backend:<semver>
#   <REGISTRY>/<NAMESPACE>/separator:<semver>
#   <REGISTRY>/<NAMESPACE>/web:<semver>
# Multi-arch: linux/amd64 + linux/arm64 (separator is CPU torch, safe for both).

name: Build Docker Images

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: .
            dockerfile: packages/backend/Dockerfile
          - name: separator
            context: packages/separator
            dockerfile: packages/separator/Dockerfile
          - name: web
            context: .
            dockerfile: packages/web/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync version to tag
        if: startsWith(github.ref_name, 'v')
        shell: bash
        run: node scripts/set-version.mjs "${GITHUB_REF_NAME#v}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ALIYUN_ACR_REGISTRY }}
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.ALIYUN_ACR_REGISTRY }}/${{ secrets.ALIYUN_ACR_NAMESPACE }}/${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
