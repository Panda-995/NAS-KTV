[package]
name = "nasktv"
version = "0.0.1"
description = "NASKTV KTV Player"
authors = ["NASKTV"]
license = ""
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "nasktv_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
if-addrs = "0.15"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tiny_http = "0.12"

[features]
custom-protocol = ["tauri/custom-protocol"]
